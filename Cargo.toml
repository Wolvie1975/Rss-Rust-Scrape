[package]
name = "web_scraper"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
feed-rs = "2.4.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
rss = "2.1.2"
scraper = "0.27.0"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1.53.1", features = ["rt", "net"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
url = "2.5.8"
